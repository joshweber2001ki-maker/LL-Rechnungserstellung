# Creator-Konfiguration. Schlüssel = Name exakt wie im Finanzsheet, Spalte "Creator:in".
# Adresse, Steuernummer/USt-IdNr. und Hinweistext kommen aus dem Tab "Finance I Creator-Adressen"
# (address_key = Name dort, falls abweichend). Hier stehen nur Dinge, die das Sheet nicht hergibt.
#
# Felder:
#   prefix          Nummernkreis der Kundenrechnung (DR-2026-NNN)
#   address_key     Name im Tab Creator-Adressen, wenn er vom Sheet-Namen abweicht
#   entity          person | ug  (ug: Kundenrechnung und Fee-Rechnung laufen auf die UG)
#   country         Sitzland der Creatorin (DE/AT/...) – steuert Steuertexte
#   vat_liable      true = umsatzsteuerpflichtig (Auslagen nur netto weiterberechnen)
#   fee_default     übliche Management Fee in % – nur für die Plausibilitätsprüfung,
#                   der Rechnungsbetrag kommt immer aus dem Sheet
#   daily_limit     max. Rechnungsbetrag netto pro Tag (null = keins)
#   notes           Besonderheiten in Klartext (werden Claude bei der Erstellung gezeigt)

